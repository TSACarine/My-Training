<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>

  --font-display:'Barlow Condensed','Arial Narrow',sans-serif; --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;

details summary{cursor:pointer;font-weight:500}

}

.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(860px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35);margin:auto}

.toast{z-index:70}

<div class="app">
  <aside class="side">
    <div class="brand">Plan de formation<small>NETIS · SHERQ</small></div>
    <nav class="nav" id="nav"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>/* Moteur du plan de formation NETIS — import Excel, conformité, plan d'actions, export.
   Fonctionne dans le navigateur (window.Engine) et sous Node (module.exports). */
(function (root) {
  'use strict';

  // ---------- Dates (ISO 'YYYY-MM-DD') ----------
  const DAY = 86400000;
  const EPOCH = Date.UTC(1899, 11, 30);
  function serialToISO(n) {
    if (n === null || n === undefined || n === '') return null;
    if (typeof n === 'string') {
      if (/^\d{4}-\d{2}-\d{2}/.test(n)) return n.slice(0, 10);
      const m = n.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
      return null;
    }
    if (n instanceof Date) return n.toISOString().slice(0, 10);
    if (typeof n !== 'number' || !isFinite(n) || n < 20000 || n > 80000) return null;
    return new Date(EPOCH + Math.floor(n) * DAY).toISOString().slice(0, 10);
  }
  function isoToSerial(iso) { return iso ? Math.round((Date.parse(iso + 'T00:00:00Z') - EPOCH) / DAY) : null; }
  function diffDays(a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / DAY); }
  function addDays(iso, d) { return new Date(Date.parse(iso + 'T00:00:00Z') + d * DAY).toISOString().slice(0, 10); }
  function addMonths(iso, m) {
    const d = new Date(Date.parse(iso + 'T00:00:00Z'));
    const day = d.getUTCDate();
    d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + m);
    const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    d.setUTCDate(Math.min(day, last));
    return d.toISOString().slice(0, 10);
  }
  function fmtFR(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }

  // ---------- Utilitaires ----------
  const S = v => (v === null || v === undefined) ? '' : String(v).trim();
  const norm = v => S(v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const num = v => { if (typeof v === 'number') return v; const n = parseFloat(S(v).replace(',', '.')); return isFinite(n) ? n : null; };

  function findHeaderRow(aoa, label) {
    const t = norm(label);
    for (let i = 0; i < aoa.length; i++) {
      const row = aoa[i] || [];
      for (let j = 0; j < row.length; j++) if (norm(row[j]) === t) return { r: i, c: j };
    }
    return null;
  }
  // Retourne les lignes sous l'en-tête sous forme d'objets {entête: valeur}
  function readTable(aoa, firstLabel, stopAtBlank) {
    if (!aoa) return [];
    const h = findHeaderRow(aoa, firstLabel);
    if (!h) return [];
    const heads = [];
    const hr = aoa[h.r];
    for (let j = h.c; j < hr.length; j++) heads.push(S(hr[j]));
    const out = [];
    for (let i = h.r + 1; i < aoa.length; i++) {
      const row = aoa[i] || [];
      const cells = row.slice(h.c);
      if (!cells.some(v => S(v) !== '')) { if (stopAtBlank) break; continue; }
      const o = { __row: i + 1 };
      heads.forEach((k, idx) => { if (k) o[k] = cells[idx] === undefined ? null : cells[idx]; });
      out.push(o);
    }
    return out;
  }
  function pick(o, ...names) {
    for (const n of names) for (const k of Object.keys(o)) if (norm(k) === norm(n)) return o[k];
    return null;
  }

  // ---------- Paramètres par défaut ----------
  const GROUPS = ['SHERQ', 'Chauffeur', 'Electricien', 'Installateur Télécom', 'Secouriste désigné'];
  function defaultSettings() {
    return {
      includeOptional: false,       // compter les formations « non obligatoires » dans le taux
      excludeInactive: true,
      delais: { Haute: 15, Moyenne: 30, Basse: 60 },
      responsableInterne: 'Carine',
      posteGroups: {},              // poste -> [groupes] (surcharges)
      posteModules: {}              // poste -> [codes modules obligatoires] (attribution automatique)
    };
  }
  function defaultGroupsForPoste(poste) {
    const p = norm(poste), g = [];
    if (/chauffeur|driver/.test(p)) g.push('Chauffeur');
    if (/electricien/.test(p)) g.push('Electricien');
    if (/rigger|installateur/.test(p)) g.push('Installateur Télécom');
    if (/sheq|sherq/.test(p)) g.push('SHERQ');
    return g;
  }
  function groupsOf(person, settings) {
    const ov = settings.posteGroups && settings.posteGroups[person.poste];
    const base = ov ? ov : defaultGroupsForPoste(person.poste);
    return Array.from(new Set(base.concat(person.groupes || [])));
  }

  // ---------- Import (tableaux de cellules par onglet) ----------
  function parseDuree(s) {
    s = S(s).toLowerCase();
    if (!s) return null;
    const m = s.match(/(\d+(?:[.,]\d+)?)/);
    if (!m) return null;
    const v = parseFloat(m[1].replace(',', '.'));
    return /jour/.test(s) ? v * 8 : v;
  }

  function parseWorkbookAOA(sheets) {
    const issues = [];
    const st = {
      personnel: [], modules: [], registre: [], habilitations: [], actions: [],
      settings: defaultSettings(), actionMeta: {}, actionOverrides: {}, seq: {}, meta: {}, pieces: {}
    };

    // Personnel
    readTable(sheets['02_Personnel'], 'ID Personnel').forEach(o => {
      const id = S(pick(o, 'ID Personnel')); if (!id) return;
      st.personnel.push({
        id, nom: S(pick(o, 'Nom complet')), sexe: S(pick(o, 'Sexe')),
        type: S(pick(o, 'Type')) || (id.startsWith('SBC') ? 'Sous-traitant' : 'Interne'),
        entreprise: S(pick(o, 'Entreprise / Entité', 'Entreprise')), poste: S(pick(o, 'Poste')),
        manager: S(pick(o, 'Manager / Responsable')), dateEntree: serialToISO(pick(o, 'Date entrée')),
        statut: S(pick(o, 'Statut')) || 'Actif', acces: S(pick(o, 'Accès site autorisé')),
        derniereVerif: serialToISO(pick(o, 'Date dernière vérification')), groupes: []
      });
    });

    // Catalogue des modules (03)
    const catalog = readTable(sheets['03_Modules de formation'], 'N°').map(o => ({
      code: S(pick(o, 'N°')), nom: S(pick(o, 'Formation')), publicCible: S(pick(o, 'Public cible')),
      dureeTxt: S(pick(o, 'Durée indicative')), duree: parseDuree(pick(o, 'Durée indicative')),
      objectif: S(pick(o, 'Objectif principal')), modalite: S(pick(o, 'Modalité')), frequence: S(pick(o, 'Fréquence'))
    }));
    const findCat = nom => {
      const n = norm(nom);
      return catalog.find(c => { const m = norm(c.nom); return m === n || m.startsWith(n.slice(0, 18)) || n.startsWith(m.slice(0, 18)); });
    };

    // Matrice des exigences (04) = référentiel
    let prevNum = 0;
    readTable(sheets['04_Matrice_Exigences'], 'Code formation').forEach(o => {
      let code = S(pick(o, 'Code formation'));
      const nom = S(pick(o, 'Formation / habilitation'));
      if (!nom) return;
      if (!/^MOD\d+$/i.test(code)) {
        const fixed = 'MOD' + String(prevNum + 1).padStart(3, '0');
        issues.push(`Matrice (ligne ${o.__row}) : code « ${code} » illisible, remplacé par ${fixed} (${nom}).`);
        code = fixed;
      }
      code = code.toUpperCase();
      prevNum = parseInt(code.slice(3), 10);
      const cat = findCat(nom) || {};
      const pm = num(pick(o, 'Périodicité (mois)'));
      st.modules.push({
        code, nom, type: S(pick(o, 'Type')) || 'Formation',
        postes: S(pick(o, 'Poste applicable')) || 'Tous',
        obligatoire: /^oui/i.test(S(pick(o, 'Obligatoire'))) ? 'Oui' : 'Non',
        periodicite: pm === null ? 0 : pm,
        alerte: num(pick(o, 'Délai alerte avant expiration (jours)')) || 0,
        exigInterne: S(pick(o, 'Exigence interne')), exigSST: S(pick(o, 'Exigence sous-traitant')),
        publicCible: cat.publicCible || '', duree: cat.duree || null, objectif: cat.objectif || '',
        modalite: cat.modalite || '', frequence: cat.frequence || ''
      });
    });
    // incohérences catalogue / matrice
    catalog.forEach(c => {
      const m = st.modules.find(x => x.code === c.code);
      if (m && norm(m.nom).slice(0, 12) !== norm(c.nom).slice(0, 12))
        issues.push(`Catalogue ${c.code} « ${c.nom} » ≠ matrice ${c.code} « ${m.nom} » : la matrice fait référence.`);
    });

    // Registre (05)
    readTable(sheets['05_Registre de formation'], 'ID').forEach(o => {
      const intitule = S(pick(o, 'Intitulé')); if (!intitule) return;
      st.registre.push({
        id: S(pick(o, 'ID')), intitule, formateur: S(pick(o, 'Formateur')), date: serialToISO(pick(o, 'Date')),
        debut: num(pick(o, 'Heure de début')), fin: num(pick(o, 'Heure de fin')), duree: num(pick(o, 'Durée')) || 0,
        type: S(pick(o, 'Type')), publicCible: S(pick(o, 'Public cible')), participants: num(pick(o, 'Participants')) || 0,
        pids: [], codes: []
      });
    });
    const modByNom = nom => { const n = norm(nom); return st.modules.find(m => norm(m.nom) === n) || st.modules.find(m => n.startsWith(norm(m.nom).slice(0, 20))); };
    st.registre.forEach(r => { const m = modByNom(r.intitule.replace(/\s-\s[^-]+$/, '')) || modByNom(r.intitule); if (m) r.codes = [m.code]; });

    // Suivi des habilitations (06)
    const pById = {}; st.personnel.forEach(p => pById[p.id] = p);
    readTable(sheets['06_Suivi habilitations'], 'Certificate Number').forEach(o => {
      const pid = S(pick(o, 'ID Personnel')); const code = S(pick(o, 'Module formation')).toUpperCase();
      if (!pid || !code) return;
      if (!pById[pid]) issues.push(`Suivi habilitations (ligne ${o.__row}) : ID ${pid} absent du registre du personnel.`);
      if (!st.modules.find(m => m.code === code)) issues.push(`Suivi habilitations (ligne ${o.__row}) : module ${code} absent de la matrice.`);
      st.habilitations.push({
        cert: S(pick(o, 'Certificate Number')), pid, nom: S(pick(o, 'Personnel')),
        entreprise: S(pick(o, 'Entreprise/Entité')), competence: S(pick(o, 'Compétence')), code,
        issue: serialToISO(pick(o, 'Issue Date')), end: serialToISO(pick(o, 'End Date')),
        entite: S(pick(o, 'Entité formatrice')), session: '', maj: serialToISO(pick(o, 'Dernière mise à jour'))
      });
    });

    // Actions manuelles (01)
    const act = findHeaderRow(sheets['01_Tableau de bord'] || [], 'ID actions');
    if (act) readTable(sheets['01_Tableau de bord'], 'ID actions').forEach(o => {
      const id = S(pick(o, 'ID actions')); if (!/^ACT-/i.test(id)) return;
      st.actions.push({
        id, intitule: S(pick(o, 'Intitulé actions')), soumission: serialToISO(pick(o, 'Date de soumission')),
        responsable: S(pick(o, 'Responsable')), echeance: serialToISO(pick(o, 'Échéance')),
        priorite: S(pick(o, 'Priorité')) || 'Moyenne', statut: S(pick(o, 'Statut')) || 'Planifier',
        commentaire: (() => { const c = pick(o, 'Commentaires'); const d = serialToISO(c); return typeof c === 'number' && d ? fmtFR(d) : S(c); })()
      });
    });

    // Données de l'outil (aller-retour)
    const tool = sheets['_Outil'];
    if (tool && tool.length) {
      try {
        const json = tool.slice(1).map(r => S(r[0])).join('');
        const t = JSON.parse(json);
        Object.assign(st.settings, t.settings || {});
        st.settings.delais = Object.assign(defaultSettings().delais, (t.settings || {}).delais || {});
        st.actionMeta = t.actionMeta || {}; st.actionOverrides = t.actionOverrides || {}; st.seq = t.seq || {}; st.pieces = t.pieces || {};
        (t.groupes || {}).constructor === Object && Object.keys(t.groupes).forEach(pid => { if (pById[pid]) pById[pid].groupes = t.groupes[pid]; });
        (t.sessions || {}).constructor === Object && Object.keys(t.sessions).forEach(id => {
          st.registre.filter(r => r.id === id).forEach(r => { r.pids = t.sessions[id].pids || []; });
        });
      } catch (e) { issues.push('Onglet _Outil illisible : réglages par défaut utilisés.'); }
    }
    st.meta.issues = issues;
    return st;
  }

  // ---------- Calcul de conformité ----------
  const OK = s => s === 'Valide' || s === 'À renouveler';

  function evalRecord(rec, mod, today) {
    let end = rec.end;
    if (!end && rec.issue && mod.periodicite > 0 && mod.periodicite < 600) end = addMonths(rec.issue, mod.periodicite);
    if (!end) return { end: null, days: null, status: 'Valide' };
    const days = diffDays(end, today);
    const status = days < 0 ? 'Expiré' : (days <= (mod.alerte || 0) ? 'À renouveler' : 'Valide');
    return { end, days, status };
  }

  function exigence(mod, person) {
    const spec = norm(person.type === 'Interne' ? mod.exigInterne : mod.exigSST);
    if (spec === 'non' || spec === 'na' || spec === 'n a') return 'na';
    if (spec === 'selon besoin') return 'conditional';
    if (spec === 'oui') return 'required';
    return mod.obligatoire === 'Oui' ? 'required' : 'optional';
  }

  function moduleApplies(m, groups) {
    const list = m.postes.split(/[,;/]/).map(x => norm(x)).filter(Boolean);
    const gn = groups.map(norm);
    return list.includes('tous') || list.some(g => gn.includes(g));
  }
  // Exigences par défaut d'un poste : déduites de la matrice et des groupes de postes
  function defaultPosteModules(state, poste) {
    const rep = state.personnel.find(p => p.poste === poste);
    if (!rep) return [];
    const groups = groupsOf(rep, state.settings);
    return state.modules.filter(m => moduleApplies(m, groups) && exigence(m, rep) === 'required' && !/desig/.test(norm(m.postes))).map(m => m.code);
  }
  function posteModules(state, poste) {
    const pm = state.settings.posteModules && state.settings.posteModules[poste];
    return pm ? pm : defaultPosteModules(state, poste);
  }

  function compute(state, today) {
    const set = state.settings;
    const mods = state.modules;
    const recBy = {}; // pid|code -> [records]
    state.habilitations.forEach(h => { (recBy[h.pid + '|' + h.code] = recBy[h.pid + '|' + h.code] || []).push(h); });

    const people = state.personnel.filter(p => !(set.excludeInactive && /inactif/i.test(p.statut)));
    const rows = people.map(p => {
      const groups = groupsOf(p, set);
      const cells = {};
      mods.forEach(m => {
                const list = m.postes.split(/[,;/]/).map(s => norm(s)).filter(Boolean);
        const pmList = posteModules(state, p.poste);
        let applies = pmList.includes(m.code);
        let mode = exigence(m, p);
        if (mode === 'optional' && applies) mode = 'required';
        const recs = recBy[p.id + '|' + m.code] || [];
        // groupes de désignation (ex. Secouriste désigné) : conditionnel tant que non désigné
        const desig = list.find(g => GROUPS.map(norm).includes(g) && /desig/.test(g));
        if (!applies && mode === 'conditional' && recs.length) applies = true; // « Selon besoin » : suivi dès que la personne détient le certificat
        if (desig) {
          if (groups.map(norm).includes(desig)) { applies = true; if (mode !== 'na') mode = 'required'; }
          else { applies = recs.length > 0; if (mode === 'required') mode = 'conditional'; }
        }
        let best = null;
        recs.forEach(r => { const e = evalRecord(r, m, today); const key = e.end || '9999-12-31'; if (!best || key > best.key) best = { key, rec: r, ...e }; });
        const cell = { code: m.code, mode, rec: best ? best.rec : null, end: best ? best.end : null, days: best ? best.days : null };
        if (!applies || mode === 'na') {
          cell.status = best ? best.status : 'NA'; cell.counted = false; cell.na = !best;
          if (best) cell.hors = true;
        } else if (best) {
          cell.status = best.status;
          cell.counted = mode === 'required' || mode === 'conditional' || set.includeOptional;
        } else if (mode === 'required') { cell.status = 'Manquant'; cell.counted = true; }
        else if (mode === 'optional') { cell.status = set.includeOptional ? 'Manquant' : 'Recommandé'; cell.counted = set.includeOptional; }
        else { cell.status = 'NA'; cell.counted = false; }
        cells[m.code] = cell;
      });
      const counted = Object.values(cells).filter(c => c.counted);
      const nc = counted.filter(c => c.status === 'Manquant' || c.status === 'Expiré').length;
      const rn = counted.filter(c => c.status === 'À renouveler').length;
      return {
        p, groups, cells, applicable: counted.length, conform: counted.filter(c => OK(c.status)).length,
        nonconform: nc, aRenouveler: rn,
        statut: nc > 0 ? 'Non conforme' : (rn > 0 ? 'À renouveler' : 'Conforme')
      };
    });

    // Synthèses
    const blank = () => ({ applicable: 0, conform: 0, manquant: 0, expire: 0, renouveler: 0 });
    const agg = { total: blank(), Interne: blank(), 'Sous-traitant': blank(), Formation: blank(), Habilitation: blank(), parEntreprise: {}, parModule: {} };
    const typeOf = {}; mods.forEach(m => typeOf[m.code] = m.type);
    const addTo = (b, c) => { b.applicable++; if (OK(c.status)) b.conform++; if (c.status === 'Manquant') b.manquant++; if (c.status === 'Expiré') b.expire++; if (c.status === 'À renouveler') b.renouveler++; };
    rows.forEach(r => {
      const ent = r.p.entreprise || '—';
      agg.parEntreprise[ent] = agg.parEntreprise[ent] || Object.assign(blank(), { personnes: 0, type: r.p.type, conformes: 0 });
      agg.parEntreprise[ent].personnes++; if (r.statut === 'Conforme') agg.parEntreprise[ent].conformes++;
      Object.values(r.cells).forEach(c => {
        if (!c.counted) return;
        addTo(agg.total, c); addTo(agg[r.p.type === 'Interne' ? 'Interne' : 'Sous-traitant'], c);
        addTo(agg[typeOf[c.code] === 'Habilitation' ? 'Habilitation' : 'Formation'], c); addTo(agg.parEntreprise[ent], c);
        agg.parModule[c.code] = agg.parModule[c.code] || blank(); addTo(agg.parModule[c.code], c);
      });
    });
    agg.personnes = { total: rows.length, interne: rows.filter(r => r.p.type === 'Interne').length, sst: rows.filter(r => r.p.type !== 'Interne').length, conformes: rows.filter(r => r.statut === 'Conforme').length };

    // KPI du registre
    const months = {};
    state.registre.forEach(r => {
      if (!r.date) return;
      const k = r.date.slice(0, 7);
      const isInt = r.pids && r.pids.length ? null : /netis/i.test(r.publicCible) || /^interne$/i.test(r.type) && /netis/i.test(r.publicCible);
      let nInt = 0, nSst = 0;
      if (r.pids && r.pids.length) r.pids.forEach(id => { const q = state.personnel.find(x => x.id === id); (q && q.type === 'Interne') ? nInt++ : nSst++; });
      else if (isInt) nInt = r.participants; else nSst = r.participants;
      const m = months[k] = months[k] || { n: 0, h: 0, hp: 0, p: 0, nNet: 0, hNet: 0, pNet: 0, nSst: 0, hSst: 0, pSst: 0 };
      const hh = r.duree || 0;
      m.n++; m.h += hh; m.p += nInt + nSst; m.hp += hh * (nInt + nSst);
      if (nInt >= nSst) { m.nNet++; m.hNet += hh; } else { m.nSst++; m.hSst += hh; }
      m.pNet += nInt; m.pSst += nSst;
    });

    const actions = buildActions(state, rows, today);
    const dups = findDuplicates(state);
    return { rows, agg, months, actions, today, dups };
  }

  // ---------- Plan d'actions automatique ----------
  function buildActions(state, rows, today) {
    const set = state.settings;
    const modBy = {}; state.modules.forEach(m => modBy[m.code] = m);
    const groups = {};
    rows.forEach(r => Object.values(r.cells).forEach(c => {
      if (!c.counted || OK(c.status) && c.status === 'Valide') return;
      const kind = c.status === 'Manquant' ? 'manquant' : (c.status === 'Expiré' ? 'expire' : 'renouveler');
      const key = `${c.code}|${r.p.entreprise || '—'}|${kind}`;
      const g = groups[key] = groups[key] || { key, code: c.code, entreprise: r.p.entreprise || '—', type: r.p.type, kind, personnes: [], minEnd: null };
      g.personnes.push({ id: r.p.id, nom: r.p.nom, poste: r.p.poste, end: c.end, days: c.days });
      if (c.end && (!g.minEnd || c.end < g.minEnd)) g.minEnd = c.end;
    }));

    const out = [];
    const openKeys = new Set();
    Object.values(groups).sort((a, b) => a.key.localeCompare(b.key)).forEach(g => {
      const m = modBy[g.code]; const n = g.personnes.length;
      const meta = state.actionMeta[g.key] = state.actionMeta[g.key] || { soumission: today };
      if (meta.closed) { delete meta.closed; meta.soumission = today; } // réapparition
      openKeys.add(g.key);
      let prio, titre;
      if (g.kind === 'expire') { prio = 'Haute'; titre = `Renouveler (expiré) — ${m.nom} : ${n} pers. ${g.entreprise}`; }
      else if (g.kind === 'manquant') {
        prio = m.type === 'Habilitation' && m.obligatoire === 'Oui' ? 'Haute' : (m.obligatoire === 'Oui' ? 'Moyenne' : 'Basse');
        titre = `Former — ${m.nom} : ${n} pers. ${g.entreprise}`;
      } else {
        const d = Math.min(...g.personnes.map(x => x.days));
        prio = d <= 15 ? 'Haute' : 'Moyenne';
        titre = `Planifier le renouvellement — ${m.nom} : ${n} pers. ${g.entreprise} (échéance la plus proche ${fmtFR(g.minEnd)})`;
      }
      const ov = state.actionOverrides[g.key] || {};
      const echeance = ov.echeance || addDays(meta.soumission, set.delais[prio] || 30);
      out.push({
        id: 'AUTO-' + (g.code + '-' + g.entreprise.replace(/[^A-Za-z0-9]+/g, '').toUpperCase().slice(0, 8) + '-' + g.kind.slice(0, 3).toUpperCase()),
        key: g.key, auto: true, intitule: ov.intitule || titre, titreAuto: titre, soumission: meta.soumission, echeance,
        responsable: ov.responsable || (g.type === 'Interne' ? set.responsableInterne : 'SHERQ ' + g.entreprise),
        priorite: ov.priorite || prio, statut: ov.statut || 'Planifier', commentaire: ov.commentaire || '',
        personnes: g.personnes, entreprise: g.entreprise, code: g.code, kind: g.kind, nb: n
      });
    });
    // Actions automatiques résolues
    Object.keys(state.actionMeta).forEach(k => {
      if (openKeys.has(k)) return;
      const meta = state.actionMeta[k];
      if (!meta.closed) meta.closed = today;
      const [code, ent, kind] = k.split('|'); const m = modBy[code]; if (!m) return;
      const ov = state.actionOverrides[k] || {};
      out.push({
        id: 'AUTO-' + (code + '-' + ent.replace(/[^A-Za-z0-9]+/g, '').toUpperCase().slice(0, 8) + '-' + kind.slice(0, 3).toUpperCase()),
        key: k, auto: true, resolved: true, intitule: ov.intitule || `${kind === 'manquant' ? 'Former' : 'Renouveler'} — ${m.nom} : ${ent}`, titreAuto: `${kind === 'manquant' ? 'Former' : 'Renouveler'} — ${m.nom} : ${ent}`,
        soumission: meta.soumission, echeance: ov.echeance || '', responsable: ov.responsable || '', priorite: ov.priorite || 'Moyenne',
        statut: 'Terminé', commentaire: 'Résolu automatiquement le ' + fmtFR(meta.closed), personnes: [], entreprise: ent, code, kind, nb: 0
      });
    });
    // Actions manuelles
    state.actions.forEach(a => out.push(Object.assign({ auto: false, personnes: [], nb: 0 }, a)));
    return out;
  }

  // ---------- Enregistrer une session de formation ----------
  function nextSessionId(state, year) {
    let max = 0;
    state.registre.forEach(r => { const m = /^FRM-(\d+)\/(\d{4})$/.exec(r.id); if (m && +m[2] === year) max = Math.max(max, +m[1]); });
    return 'FRM-' + String(max + 1).padStart(3, '0') + '/' + year;
  }
  // s: {codes[], date, debut, fin, duree, formateur, type, entite, publicCible, cert, participants:[{pid, cert?, end?}]}
  function addSession(state, s) {
    const id = s.id || nextSessionId(state, +s.date.slice(0, 4));
    const pById = {}; state.personnel.forEach(p => pById[p.id] = p);
    let added = 0, skipped = 0;
    s.codes.forEach(code => {
      const m = state.modules.find(x => x.code === code);
      state.registre.push({
        id, intitule: m.nom, formateur: s.formateur || s.entite || '', date: s.date, debut: s.debut ?? null, fin: s.fin ?? null,
        duree: s.duree || m.duree || 0, type: s.type || '', publicCible: s.publicCible || '',
        participants: s.participants.length, pids: s.participants.map(x => x.pid), codes: [code]
      });
      s.participants.forEach(x => {
        const p = pById[x.pid]; if (!p) return;
        if (state.habilitations.some(h => h.pid === x.pid && h.code === code && h.issue === s.date && (h.session === id || h.cert === (x.cert || s.cert || id)))) { skipped++; return; }
        let end = x.end || s.end || null;
        if (!end && m.periodicite > 0 && m.periodicite < 600) end = addMonths(s.date, m.periodicite);
        state.habilitations.push({
          cert: x.cert || s.cert || id, pid: x.pid, nom: p.nom, entreprise: p.entreprise, competence: m.nom, code,
          issue: s.date, end, entite: s.entite || s.formateur || '', session: id, maj: s.today || s.date
        });
        added++;
      });
    });
    return { id, added, skipped };
  }

  // ---------- Export (tableaux de cellules) ----------
  const STATUT_XL = { 'Valide': 'Valide', 'À renouveler': 'À renouveler', 'Expiré': 'Expiré', 'Manquant': 'Manquant', 'NA': 'NA', 'Recommandé': 'Recommandé' };
  function exportSheets(state, result, today) {
    const d = v => v ? isoToSerial(v) : '';
    const sh = {};
    const pcNames = k => ((state.pieces || {})[k] || []).map(f => f.name).join(' ; ');
    sh['Introduction'] = [[], ['PLAN DE FORMATION'], [],
      ['INFORMATIONS DU DOCUMENT'], ['Référence du Document:', 'SSE-MG-FO-V0'], ['Mise à jour automatique:', d(today)], ['Généré par:', 'Outil Plan de formation NETIS'], [],
      ['Onglet', 'Description'],
      ['01_Tableau de bord', 'KPI, conformité, suivi des actions (manuelles + automatiques)'],
      ['02_Personnel', 'Registre du personnel'], ['03_Modules de formation', 'Catalogue'],
      ['04_Matrice_Exigences', 'Référentiel des exigences (source du calcul)'], ['05_Registre de formation', 'Sessions'],
      ['06_Suivi habilitations', 'Base nominative des certificats'], ['07_Conformité', 'Matrice calculée personne × module'], ['_Outil', 'Réglages de l\'outil — ne pas modifier']];

    // 01 Tableau de bord
    const a = result.agg; const pct = b => b.applicable ? b.conform / b.applicable : 0;
    const mk = Object.keys(result.months).sort();
    const T = [[], [], [], [], ['', 'TABLEAU DE BORD DE FORMATION - SENSIBILISATION'], ['', 'Mis à jour le', d(today)], [],
      ['', 'I. KPI formations (issues du registre)'], ['', 'Mois'].concat(mk), ['Global', 'Nombre de formation'].concat(mk.map(k => result.months[k].n)),
      ['', 'Total heures'].concat(mk.map(k => Math.round(result.months[k].h * 100) / 100)), ['', 'Participants'].concat(mk.map(k => result.months[k].p)),
      ['NETIS', 'Nombre de formation'].concat(mk.map(k => result.months[k].nNet)), ['SOUS-TRAITANTS', 'Nombre de formation'].concat(mk.map(k => result.months[k].nSst)), [],
      ['', 'II. Conformité des formations et habilitations'], ['', 'Éléments', 'Total', 'NETIS', 'SOUS-TRAITANTS'],
      ['', 'Personnes actives', a.personnes.total, a.personnes.interne, a.personnes.sst],
      ['', 'Exigences conformes', a.total.conform, a.Interne.conform, a['Sous-traitant'].conform],
      ['', 'Exigences non conformes (manquantes + expirées)', a.total.manquant + a.total.expire, a.Interne.manquant + a.Interne.expire, a['Sous-traitant'].manquant + a['Sous-traitant'].expire],
      ['', 'dont à renouveler (alerte)', a.total.renouveler, a.Interne.renouveler, a['Sous-traitant'].renouveler],
      ['', 'Taux de conformité global', pct(a.total), pct(a.Interne), pct(a['Sous-traitant'])],
      ['', 'Taux conformité formations', pct(a.Formation)], ['', 'Taux conformité habilitations', pct(a.Habilitation)], [],
      ['', 'III. Suivi des actions'],
      ['ID actions', 'Intitulé actions', 'Date de soumission', 'Responsable', 'Échéance', 'Priorité', 'Statut', 'Commentaires', 'Pièces jointes']];
    result.actions.forEach(x => T.push([x.id, x.intitule, d(x.soumission), x.responsable, d(x.echeance), x.priorite, x.statut, x.commentaire, pcNames('act:' + (x.auto ? x.key : x.id))]));
    sh['01_Tableau de bord'] = T;

    sh['02_Personnel'] = [[], [], [], [], ['', 'REGISTRE DU PERSONNEL'], [],
      ['ID Personnel', 'Nom complet', 'Sexe', 'Type', 'Entreprise / Entité', 'Poste', 'Manager / Responsable', 'Date entrée', 'Statut', 'Accès site autorisé', 'Date dernière vérification']]
      .concat(state.personnel.map(p => [p.id, p.nom, p.sexe, p.type, p.entreprise, p.poste, p.manager, d(p.dateEntree), p.statut, p.acces, d(p.derniereVerif)]));
    sh['03_Modules de formation'] = [[], ['', 'MODULES DE FORMATION'], ['N°', 'Formation', 'Public cible', 'Durée indicative', 'Objectif principal', 'Modalité', 'Fréquence']]
      .concat(state.modules.map(m => [m.code, m.nom, m.publicCible, m.duree ? m.duree + 'h' : '', m.objectif, m.modalite, m.frequence]));
    sh['04_Matrice_Exigences'] = [[], [], [], [], ['', 'MATRICE DES EXIGENCES'], [],
      ['Code formation', 'Formation / habilitation', 'Poste applicable', 'Type', 'Obligatoire', 'Périodicité (mois)', 'Délai alerte avant expiration (jours)', 'Exigence interne', 'Exigence sous-traitant']]
      .concat(state.modules.map(m => [m.code, m.nom, m.postes, m.type, m.obligatoire, m.periodicite, m.alerte, m.exigInterne, m.exigSST]));
    sh['05_Registre de formation'] = [[], [], [], [], ['', 'REGISTRE DE FORMATION'], [],
      ['ID', 'Intitulé', 'Formateur', 'Date', 'Heure de début', 'Heure de fin', 'Durée', 'Type', 'Public cible', 'Participants', 'Pièces jointes']]
      .concat(state.registre.map(r => [r.id, r.intitule, r.formateur, d(r.date), r.debut ?? '', r.fin ?? '', r.duree, r.type, r.publicCible, r.participants, pcNames('ses:' + r.id)]));
    sh['06_Suivi habilitations'] = [['SUIVI HABILITATIONS'], [],
      ['Certificate Number', 'ID Personnel', 'Personnel', 'Entreprise/Entité', 'Compétence', 'Module formation', 'Issue Date', 'End Date', 'Entité formatrice', 'Statut', 'Dernière mise à jour']]
      .concat(state.habilitations.map(h => {
        const m = state.modules.find(x => x.code === h.code) || { periodicite: 0, alerte: 0 };
        return [h.cert, h.pid, h.nom, h.entreprise, h.competence, h.code, d(h.issue), d(h.end), h.entite, evalRecord(h, m, today).status, d(h.maj)];
      }));
    const codes = state.modules.map(m => m.code);

(function(){

// ---------- Tableau de bord ----------
function vDash(m){

  ${dupBanner()}
  <div class="grid g4">

    <div class="card kpi"><div class="lbl">Personnes entièrement conformes</div><div class="big">${a.personnes.conformes} <span class="muted" style="font-size:24px">/ ${a.personnes.total}</span></div><div class="sub">${a.personnes.interne} NETIS · ${a.personnes.sst} sous-traitants actifs</div></div>
    <div class="card kpi"><div class="lbl">Écarts à traiter</div><div class="big">${t.manquant+t.expire}</div><div class="sub">${t.manquant} manquantes · ${t.expire} expirées · ${t.renouveler} à renouveler sous alerte</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Conformité par entreprise</h3>${bars(ent)||'<div class="empty">Aucune donnée</div>'}</div>
    <div class="card"><h3>Conformité par module</h3>${bars(mods)}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Actions prioritaires ouvertes</h3>
      ${top.length?'<div class="tw" style="max-height:none"><table><tbody>'+top.map(x=>`<tr><td>${esc(x.intitule)}</td><td class="mono" style="white-space:nowrap">${fmt(x.echeance)}</td></tr>`).join('')+'</tbody></table></div><p><button class="btn sm" data-go="actions">Voir tout le plan d\'actions</button></p>':'<div class="empty">Aucune action de priorité haute.</div>'}
    </div>
    <div class="card"><h3>Formations des ${hz} prochains jours</h3>
      <p class="muted" style="margin-top:0"><b>${exp.length}</b> échéance(s) d'ici le ${fmt(E.addDays(TODAY,hz))}. <label>Horizon <input type="number" id="hz" value="${hz}" min="1" max="365" style="width:70px;display:inline-block;padding:2px 6px"> jours</label></p>
      ${exp.length?'<div class="tw" style="max-height:260px"><table><thead><tr><th>Personne</th><th>Formation / habilitation</th><th>Échéance</th><th>Reste</th></tr></thead><tbody>'+exp.map(({r,c})=>`<tr><td><button class="lnk" data-open="${esc(r.p.id)}">${esc(r.p.nom)}</button><div class="muted" style="font-size:11px">${esc(r.p.entreprise)}</div></td><td>${esc(modName[c.code])}</td><td class="mono">${fmt(c.end)}</td><td class="mono">${c.days} j</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Aucune échéance dans cet horizon.</div>'}
    </div>
  </div>
  <div class="card"><h3>Formations par mois</h3>
      ${mk.length?'<div class="tw" style="max-height:none"><table><thead><tr><th>Mois</th><th>Sessions</th><th>Personnes formées</th><th>Participations</th><th>Durée totale (h)</th><th>Durée moy. / session (h)</th><th>Heures-personnes</th><th>NETIS</th><th>Sous-traitants</th></tr></thead><tbody>'+mk.map(k=>{const v=R.months[k]||{n:0,h:0,p:0,pNet:0,pSst:0,hp:0};const tr=trained[k]?trained[k].size:0;return `<tr><td>${MOIS[+k.slice(5)-1]} ${k.slice(0,4)}</td><td><span style="display:inline-block;height:8px;width:${Math.round(60*v.n/maxN)}px;background:var(--accent);border-radius:2px;margin-right:6px"></span>${v.n}</td><td class="mono"><b>${tr}</b></td><td class="mono">${v.p}</td><td class="mono">${Math.round(v.h*10)/10}</td><td class="mono">${v.n?Math.round(10*v.h/v.n)/10:'–'}</td><td class="mono">${Math.round(v.hp*10)/10}</td><td class="mono">${v.pNet}</td><td class="mono">${v.pSst}</td></tr>`}).join('')+'</tbody></table></div><p class="muted" style="font-size:12px;margin-bottom:0">« Personnes formées » = personnes distinctes ayant reçu un certificat dans le mois (sessions et certificats externes). « Participations » et heures viennent du registre des sessions.</p>':'<div class="empty">Aucune session enregistrée.</div>'}
  </div>
  <div class="grid g2" hidden>  </div>`;
  m.onclick = e => { const dp=e.target.closest('[data-dup]'); if(dp){ FILT.dTab='pers'; FILT.dq=''; FILT.dF={pers:{dup:'Oui'}}; view='donnees'; render(); return; } const b=e.target.closest('[data-go]'); if(b){view=b.dataset.go;render();return;} const o=e.target.closest('[data-open]'); if(o) openProfile(o.dataset.open); };

function visiblePeople(){

function sessionHours(){
  if (F.duree) return +F.duree;
  if (F.debut && F.fin) { const [a,b]=F.debut.split(':'),[c,d]=F.fin.split(':'); const h=(+c*60+ +d-(+a*60+ +b))/60; if(h>0) return Math.round(h*100)/100; }
  return null;
}
function fPrev(){
  const el=$('#fPreview'); if(!el) return;
  if(!F.codes.size){ el.textContent='Choisissez au moins un module pour voir les échéances calculées.'; return; }
  const h = sessionHours();
  el.innerHTML = '<b>Échéances calculées</b> à partir de la date de session :<br>' + [...F.codes].map(c=>{const x=S.modules.find(m=>m.code===c); const e=F.end || (x.periodicite>0&&x.periodicite<600&&F.date?E.addMonths(F.date,x.periodicite):null); return esc(x.nom)+' → '+(e?fmt(e)+(F.end?'':' ('+x.periodicite+' mois)'):'sans échéance');}).join('<br>') + '<br>Durée retenue : '+(h?h+' h':'durée du catalogue / non renseignée')+'.';
}
function saveSession(){
  const msg=$('#fMsg');
  if(!F.codes.size){ msg.textContent='Choisissez au moins un module.'; return; }
  if(!F.date){ msg.textContent='Indiquez la date de la session.'; return; }
  if(!F.sel.size){ msg.textContent='Sélectionnez au moins un participant.'; return; }
  const before = R.agg.total.conform;
  const parts=[...F.sel.entries()].map(([pid,v])=>({pid,cert:v.cert||undefined,end:v.end||undefined}));
  const ents=[...new Set(parts.map(x=>S.personnel.find(p=>p.id===x.pid).entreprise))];
  const res = E.addSession(S,{codes:[...F.codes],date:F.date,debut:null,fin:null,duree:sessionHours()||undefined,formateur:F.formateur,type:F.type,entite:F.entite||F.formateur,publicCible:ents.join(', '),cert:F.cert||undefined,end:F.end||undefined,participants:parts,today:TODAY});
  F=null; recompute(); persist();
  const gained=R.agg.total.conform-before;
  view='conformite'; render();
  toast('Session '+res.id+' enregistrée : '+res.added+' certificat(s) ajouté(s), '+gained+' exigence(s) devenue(s) conforme(s)'+(res.skipped?', '+res.skipped+' doublon(s) ignoré(s)':'')+'.');
}

function openActionEdit(pk){
  const a=R.actions.find(x=>pkAct(x)===pk); if(!a){ toast('Action introuvable.'); return; }
  const sel=(opts,cur)=>opts.map(x=>`<option${x===cur?' selected':''}>${x}</option>`).join('');
  const html=`${a.auto?'<div class="note" style="margin-bottom:12px">Action automatique : elle disparaît d\'elle-même quand l\'écart est comblé. Vos modifications sont conservées tant qu\'elle existe.</div>':''}
  <div class="dgrid">
    <label class="f wide">Intitulé<input type="text" data-me="intitule" value="${esc(a.intitule||'')}"></label>

    <label class="f">Priorité<select data-me="priorite">${sel(['Haute','Moyenne','Basse'],a.priorite)}</select></label>
    <label class="f">Statut<select data-me="statut">${sel(['Planifier','En cours','Terminé','Annulé'],a.statut)}</select></label>
    <label class="f">Échéance<input type="date" data-me="echeance" value="${esc(a.echeance||'')}"></label>
    ${a.auto?`<label class="f">Date de soumission<span class="mono" style="text-transform:none;letter-spacing:0;color:var(--ink);font-size:14px;padding:7px 0">${fmt(a.soumission)||'–'}</span></label>`:`<label class="f">Date de soumission<input type="date" data-me="soumission" value="${esc(a.soumission||'')}"></label>`}
    <label class="f wide">Commentaire<input type="text" data-me="commentaire" value="${esc(a.commentaire||'')}"></label>
  </div>
  <h3 style="margin:18px 0 8px">Pièces jointes</h3>
  ${piecesHtml(pk)}`;
  modal('Modifier l\'action '+a.id, html, 'Enregistrer', ov=>{
    const g=k=>{ const i=ov.querySelector(`[data-me="${k}"]`); return i?i.value.trim():''; };
    const v={intitule:g('intitule'),responsable:g('responsable'),priorite:g('priorite'),statut:g('statut'),echeance:g('echeance'),commentaire:g('commentaire')};
    if(!v.intitule){ toast('L\'intitulé est obligatoire.'); return; }
    if(a.auto){
      const o=Object.assign({}, S.actionOverrides[a.key]||{});
      o.responsable=v.responsable; o.priorite=v.priorite; o.statut=v.statut; o.echeance=v.echeance; o.commentaire=v.commentaire;
      if(v.intitule!==(a.titreAuto||a.intitule)) o.intitule=v.intitule; else delete o.intitule;
      S.actionOverrides[a.key]=o;
    } else {
      const t=S.actions.find(x=>x.id===a.id); if(!t){ toast('Action introuvable.'); return; }
      Object.assign(t,{intitule:v.intitule,responsable:v.responsable,priorite:v.priorite,statut:v.statut,echeance:v.echeance,commentaire:v.commentaire,soumission:g('soumission')||t.soumission});
    }
    closeModal(); commit('Action enregistrée.');
  });
}

// ---------- Données ----------
const DTABS=[['pers','Personnel'],['mat','Matrice des exigences'],['reg','Registre des sessions'],['pos','Exigences par poste'],['hab','Certificats'],['lots','Importer un lot']];
function modByCode(){ const o={}; S.modules.forEach(x=>o[x.code]=x); return o; }
function dupSet(){ return new Set(R.dups.flatMap(d=>[d.a,d.b])); }
function evH(h,modBy){ return E.evalRecord(h, modBy[h.code]||{periodicite:0,alerte:0}, TODAY); }
// Pour chaque onglet : éléments, fonction de recherche texte et filtres (k = clé, v = valeur de filtrage, lab = libellé)
function dConf(t,ctx){
  const dup=ctx.dup, modBy=ctx.modBy;
  if(t==='pers') return {all:S.personnel, txt:p=>p.id+' '+p.nom+' '+p.entreprise+' '+p.poste, defs:[
    {k:'type',l:'Type',v:p=>p.type||'(vide)'},
    {k:'ent',l:'Entreprise',v:p=>p.entreprise||'(vide)'},
    {k:'poste',l:'Poste',v:p=>p.poste||'(vide)'},
    {k:'statut',l:'Statut',v:p=>p.statut||'(vide)'},
    {k:'groupe',l:'Secouriste désigné',v:p=>(p.groupes||[]).includes('Secouriste désigné')?'Oui':'Non'},
    {k:'dup',l:'Doublon possible',v:p=>dup.has(p.id)?'Oui':'Non'}]};
  if(t==='mat') return {all:S.modules, txt:x=>x.code+' '+x.nom, defs:[
    {k:'type',l:'Type',v:x=>x.type||'(vide)'},
    {k:'oblig',l:'Obligatoire',v:x=>x.obligatoire},
    {k:'per',l:'Périodicité',v:x=>x.periodicite>0?'Avec échéance':'Sans échéance'},
    {k:'postes',l:'Poste applicable',v:x=>x.postes||'(vide)'}]};
  if(t==='reg') return {all:S.registre, txt:r=>r.id+' '+r.intitule+' '+r.formateur+' '+r.publicCible, defs:[
    {k:'form',l:'Formateur',v:r=>r.formateur||'(vide)'},
    {k:'type',l:'Type',v:r=>r.type||'(vide)'},
    {k:'an',l:'Année',v:r=>r.date?r.date.slice(0,4):'(sans date)'},
    {k:'pj',l:'Pièces jointes',v:r=>piecesOf(pkSes(r.id)).length?'Oui':'Non'}]};
  if(t==='pos') return {all:[...new Set(S.personnel.map(p=>p.poste).filter(Boolean))].sort().map(po=>({po})), txt:x=>x.po, defs:[
    {k:'mods',l:'Exigences par poste',v:x=>E.posteModules(S,x.po).length?'Avec modules':'Aucun module'},
    {k:'grp',l:'Groupe de poste',v:x=>{ const rep=S.personnel.find(p=>p.poste===x.po); return rep?(E.groupsOf(rep,S.settings).join(', ')||'(aucun)'):'(aucun)'; }}]};
  return {all:S.habilitations, txt:h=>h.nom+' '+h.pid+' '+h.competence+' '+h.cert+' '+h.entreprise, defs:[
    {k:'ent',l:'Entreprise',v:h=>h.entreprise||'(vide)'},
    {k:'mod',l:'Module',v:h=>h.code,lab:h=>modBy[h.code]?modBy[h.code].nom:h.code},
    {k:'st',l:'Statut',v:h=>evH(h,modBy).status},
    {k:'ef',l:'Entité formatrice',v:h=>h.entite||'(vide)'},
    {k:'an',l:'Année de délivrance',v:h=>h.issue?h.issue.slice(0,4):'(sans date)'}]};
}
function vData(m){
  const t=FILT.dTab, modBy=modByCode(), dup=dupSet(), ctx={dup,modBy};
  const tabs=DTABS.map(([k,l])=>[k,l,k==='lots'?(S.batches||[]).length:dConf(k,ctx).all.length]);
  const tabsH=`<div class="tabs">${tabs.map(([k,l,n])=>`<button type="button" data-t="${k}" aria-pressed="${t===k}">${l} (${n})</button>`).join('')}</div>`;
  if(t==='lots'){
    m.innerHTML=`<div class="head"><div><h2>Données</h2><p>Importez en une fois une liste de personnes ou de formations. Le fichier est vérifié ligne à ligne avant tout enregistrement, et le dernier lot peut être annulé.</p></div></div>${tabsH}<div id="dBody"></div>`;
  } else {
    const C=dConf(t,ctx), Fd=FILT.dF[t]||{};

// Alerte et tableau des doublons possibles (Données → Personnel)
function dupCard(){
  if(!R.dups.length) return '';
  const lines=R.dups.map(d=>{
    const a=S.personnel.find(p=>p.id===d.a), b=S.personnel.find(p=>p.id===d.b); if(!a||!b) return '';
    const line=p=>`<b>${esc(p.nom)}</b><div class="muted mono" style="font-size:11px">${esc(p.id)} · ${esc(p.entreprise)} · ${esc(p.poste)} · ${esc(p.statut)}</div>`;
    return `<tr><td>${line(a)}</td><td>${line(b)}</td><td>${d.why==='exact'?pill('même nom','bad'):pill('nom très proche','warn')}</td>
      <td style="white-space:nowrap"><button class="btn sm primary" data-merge data-ma="${esc(a.id)}" data-mb="${esc(b.id)}">Fusionner…</button> <button class="btn sm" data-notdup data-ma="${esc(a.id)}" data-mb="${esc(b.id)}">Pas un doublon</button></td></tr>`;
  }).join('');
  return `<div class="card" style="border-color:var(--warn)"><h3>⚠ Doublons possibles (${R.dups.length})</h3><p class="muted" style="margin-top:0">Ces fiches semblent décrire la même personne. Fusionnez-les en choisissant les informations à conserver, ou indiquez que ce n'est pas un doublon.</p><div class="tw" style="max-height:none"><table><tbody>${lines}</tbody></table></div></div>`;
}
function dupBanner(){
  const n=R.dups.length; if(!n) return '';

// Prochaine formation = lendemain de l'échéance (J+1) ; « Renouvelée » si un certificat plus récent existe pour le même module
function nextTraining(h, ev){
  const end = h.end || ev.end; if(!end) return '<span class="muted">sans échéance</span>';
  const newer = S.habilitations.some(x=>x!==h && x.pid===h.pid && x.code===h.code && x.issue && h.issue && x.issue>h.issue);
  return fmt(E.addDays(end,1)) + (newer ? ' <span class="pill p-ok">renouvelée</span>' : '');
}

function buildWorkbook(){
  const sheets=E.exportSheets(S,R,TODAY), wb=XLSX.utils.book_new();
  const dateHdr=['Date entrée','Date dernière vérification','Date','Issue Date','End Date','Dernière mise à jour','Date de soumission','Échéance'];
  Object.keys(sheets).forEach(name=>{
    const aoa=sheets[name], ws=XLSX.utils.aoa_to_sheet(aoa);
    const hdrRow=aoa.findIndex(r=>r&&r.some(c=>dateHdr.includes(c))&&r.filter(Boolean).length>3);
    if(hdrRow>=0){ aoa[hdrRow].forEach((h,c)=>{ if(!dateHdr.includes(h)) return; for(let r=hdrRow+1;r<aoa.length;r++){const ref=XLSX.utils.encode_cell({r,c}); if(ws[ref]&&ws[ref].t==='n') ws[ref].z='dd/mm/yyyy';}}); }
    if(name==='01_Tableau de bord'){ aoa.forEach((row,r)=>{ if(/^Taux/.test(row[1]||'')) for(let c=2;c<6;c++){const ref=XLSX.utils.encode_cell({r,c}); if(ws[ref]&&ws[ref].t==='n') ws[ref].z='0.0%';} if(row[1]==='Mis à jour le'){const ref=XLSX.utils.encode_cell({r,c:2}); if(ws[ref]) ws[ref].z='dd/mm/yyyy';} }); }
    const w=[]; aoa.forEach(r=>(r||[]).forEach((v,c)=>{const l=Math.min(48,String(v??'').length+2); if(!w[c]||w[c]<l) w[c]=l;}));
    ws['!cols']=w.map(x=>({wch:Math.max(8,x||8)}));
    XLSX.utils.book_append_sheet(wb,ws,name);
    if(name==='_Outil') wb.Workbook={Sheets:Object.keys(sheets).map(n=>({name:n,Hidden:n==='_Outil'?1:0}))};
  });
  return wb;
}

// ---------- Enregistrement des fichiers : passerelle Claude si disponible, sinon téléchargement du navigateur ----------
async function saveFile(bytes, filename, mime){
  if(window.claude && typeof window.claude.use==='function'){
    try{ const d=await window.claude.use('downloads'); if(d){ await d.save({filename,data:bytes}); return true; } }
    catch(e){ if(e&&e.code==='declined') return false; }
  }
  const url=URL.createObjectURL(new Blob([bytes],{type:mime||'application/octet-stream'}));
  const a=document.createElement('a'); a.href=url; a.download=filename; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  return true;
}

// ---------- Fichiers joints : contenu stocké dans IndexedDB (le classeur ne garde que le nom) ----------
const MAX_PJ=15*1024*1024;
const FX=(()=>{
  let p=null;
  const db=()=>p||(p=new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('stockage indisponible')); return; }
    const r=indexedDB.open('netis-plan-fichiers',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('f');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>{ p=null; rej(r.error); };
  }));
  const run=async(mode,fn)=>{ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction('f',mode); const q=fn(t.objectStore('f')); t.oncomplete=()=>res(q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); };
  return { put:(id,rec)=>run('readwrite',s=>s.put(rec,id)), get:id=>run('readonly',s=>s.get(id)), del:id=>run('readwrite',s=>s.delete(id)), clear:()=>run('readwrite',s=>s.clear()) };
})();
function readBuf(f){
  if(f.arrayBuffer) return f.arrayBuffer();
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(f); });
}
function piecesOf(key){ return (S.pieces&&S.pieces[key])||[]; }
function pkSes(id){ return 'ses:'+id; }
function fsize(n){ return n<1024?n+' o':n<1048576?Math.round(n/1024)+' Ko':(Math.round(n/104857.6)/10).toString().replace('.',',')+' Mo'; }
function piecesHtml(key){
  const list=piecesOf(key);
  const ul=list.length?'<ul class="pl">'+list.map(f=>`<li><button type="button" class="lnk" data-pdl data-pk="${esc(key)}" data-fid="${esc(f.fid)}" title="Télécharger">${esc(f.name)}</button><span class="muted mono" style="font-size:11px">${fsize(f.size)}</span><button type="button" class="btn sm danger" data-pdel data-pk="${esc(key)}" data-fid="${esc(f.fid)}" aria-label="Retirer ${esc(f.name)}">×</button></li>`).join('')+'</ul>':'<div class="muted" style="font-size:12px;margin-bottom:6px">Aucune pièce jointe.</div>';

}

let armPj=null;
document.addEventListener('change', async e=>{
  const i=e.target;
  if(!(i instanceof HTMLInputElement) || i.type!=='file' || !i.dataset.pkey) return;
  const key=i.dataset.pkey, files=Array.from(i.files||[]); i.value='';

    try{

document.addEventListener('click', async e=>{
  const el=e.target.closest?e.target.closest('[data-pdl],[data-pdel]'):null; if(!el) return;

const sv=v=>(v===null||v===undefined)?'':String(v).trim();

function parseDateAny(v){
  if(typeof v==='number') return E.serialToISO(v)||null;
  const s=sv(v); if(!s) return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return isoOk(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/); if(m) return isoOk(+m[3],+m[2],+m[1]);
  return null;
}
function parseNum(v){ const s=sv(v).replace(',','.'); if(!s) return ''; const n=parseFloat(s); return isFinite(n)?n:null; }
function normType(v){ const s=E.norm(v); if(/^interne/.test(s)) return 'Interne'; if(/sous|^st$|^sst$/.test(s)) return 'Sous-traitant'; return null; }
function normStatut(v){ const s=E.norm(v); if(/^actif/.test(s)) return 'Actif'; if(/^inactif/.test(s)) return 'Inactif'; return null; }
function normSexe(v){ const s=E.norm(v); if(/^(m|male|homme|h)$/.test(s)) return 'Male'; if(/^(f|female|femme)$/.test(s)) return 'Female'; return null; }
function normFType(v){ const s=E.norm(v); if(!s||/^interne/.test(s)) return 'Interne'; if(/^externe/.test(s)) return 'Externe'; if(/e ?learning/.test(s)) return 'e-learning'; return null; }
function yesNo(v){ return /^(oui|o|x|1|yes|y|true)$/.test(E.norm(v)); }

// --- Lecture du fichier ---
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=(text.split(/\r?\n/)[0])||'';
  const cnt=c=>first.split(c).length-1;
  const sep=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(field); field=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(v=>sv(v)!==''));
}
function readText(f){
  if(f.text) return f.text();
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(f,'utf-8'); });
}
// Cherche la ligne d'en-tête (utile pour les feuilles avec un titre au-dessus)
function detectHeader(rows,target){
  const T=LOT_T[target];
  const al=new Set(T.fields.flatMap(f=>f.al.map(a=>E.norm(a))).concat(T.fields.map(f=>E.norm(f.h))));
  let best={idx:0,score:-1};
  rows.slice(0,40).forEach((r,i)=>{ const sc=(r||[]).filter(c=>al.has(E.norm(sv(c)))).length; if(sc>best.score) best={idx:i,score:sc}; });
  if(best.score<2) best.idx=0;
  return {idx:best.idx, headers:((rows[best.idx])||[]).map(sv)};
}
function autoMap(headers,target){
  const hn=headers.map(h=>E.norm(h)), out={};
  LOT_T[target].fields.forEach(f=>{
    let idx=-1;
    for(const a of f.al.map(x=>E.norm(x)).concat([E.norm(f.h)])){ const j=hn.indexOf(a); if(j>=0){ idx=j; break; } }
    out[f.k]=idx;
  });
  return out;
}
async function lotLoad(file){
  LOT.msg=''; LOT.file=file.name;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  try{
    let raw, sheet='';
    if(['xlsx','xls','xlsm'].includes(ext)){
      if(!window.XLSX) throw new Error('la bibliothèque Excel n\'est pas chargée (vérifiez la connexion internet)');
      const wb=XLSX.read(new Uint8Array(await readBuf(file)),{type:'array'});
      sheet=(LOT.target==='pers'&&wb.SheetNames.includes('02_Personnel'))?'02_Personnel':wb.SheetNames[0];
      raw=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:true,defval:'',blankrows:false});
    } else {
      raw=parseCSV(await readText(file));
    }
    if(!raw||!raw.some(r=>(r||[]).some(v=>sv(v)!==''))) throw new Error('le fichier est vide');
    const hd=detectHeader(raw,LOT.target);
    LOT.hdr=hd.idx; LOT.headers=hd.headers; LOT.sheet=sheet;
    LOT.rows=raw.slice(hd.idx+1).filter(r=>r.some(v=>sv(v)!==''));
    LOT.map=autoMap(hd.headers,LOT.target);
    if(!Object.values(LOT.map).some(x=>x>=0)){
      LOT.rows=null; LOT.headers=[];
      LOT.msg='Aucune colonne reconnue dans ce fichier. Téléchargez le modèle (bouton en haut) pour voir les en-têtes attendus.';
    }
  }catch(err){ LOT.rows=null; LOT.headers=[]; LOT.msg='Lecture impossible : '+(err&&err.message||err); }
  lotValidate();
}

// --- Vérification ligne à ligne : rien n'est écrit ici ---
function lotValidate(){
  if(!LOT.rows){ LOT.items=null; return; }
  LOT.items=LOT.target==='pers'?lotValPers(LOT.rows,LOT.map,LOT.mode):lotValForm(LOT.rows,LOT.map);
}
function lotValPers(rows,mp,mode){
  const g=(r,k)=>mp[k]>=0?r[mp[k]]:'';
  const seen=new Set(), items=[];
  rows.forEach((r,i)=>{
    const t=k=>sv(g(r,k));
    const it={n:i+1,id:t('id'),nom:t('nom'),cols:[],status:'error',msg:'',rec:null,warn:false};
    it.cols=[it.id,it.nom]; items.push(it);
    if(!it.id){ it.msg='ID Personnel manquant'; return; }
    if(!it.nom){ it.msg='Nom complet manquant'; return; }
    if(seen.has(it.id)){ it.msg='ID en double dans le fichier'; return; }
    seen.add(it.id);
    const rec={id:it.id,nom:it.nom};
    if(t('type')){ const v=normType(t('type')); if(v===null){ it.msg='Type inconnu (Interne ou Sous-traitant)'; return; } rec.type=v; }
    if(t('statut')){ const v=normStatut(t('statut')); if(v===null){ it.msg='Statut inconnu (Actif ou Inactif)'; return; } rec.statut=v; }
    if(t('sexe')){ const v=normSexe(t('sexe')); if(v===null){ it.msg='Sexe inconnu (Male ou Female)'; return; } rec.sexe=v; }
    ['entreprise','poste','manager','acces'].forEach(k=>{ if(t(k)) rec[k]=t(k); });
    for(const k of ['dateEntree','derniereVerif']){
      if(t(k)==='') continue;
      const d=parseDateAny(g(r,k));
      if(!d){ it.msg=PLAB[k].charAt(0).toUpperCase()+PLAB[k].slice(1)+' invalide (jj/mm/aaaa ou aaaa-mm-jj)'; return; }
      rec[k]=d;
    }
    if(t('secou')!=='') rec.secou=yesNo(t('secou'));
    const ex=S.personnel.find(p=>p.id===it.id);
    if(ex){
      if(mode!=='update'){ it.status='skip'; it.msg='Déjà présent : ignoré'; return; }
      const diff=[];
      Object.keys(rec).forEach(k=>{ if(k==='id'||k==='secou') return; if(String(ex[k]==null?'':ex[k])!==String(rec[k])) diff.push(PLAB[k]||k); });
      if(rec.secou!==undefined && rec.secou!==(ex.groupes||[]).includes('Secouriste désigné')) diff.push('secouriste désigné');
      if(!diff.length){ it.status='skip'; it.msg='Déjà présent, aucune différence'; return; }
      it.rec=rec; it.status='update'; it.msg='Mise à jour : '+diff.join(', '); return;
    }
    rec.type=rec.type||(it.id.startsWith('SBC')?'Sous-traitant':'Interne');
    rec.statut=rec.statut||'Actif';
    rec.secou=rec.secou===true;
    it.rec=rec; it.status='new';
    const dn=S.personnel.find(p=>E.nameKey(p.nom)===E.nameKey(it.nom));
    if(dn){ it.warn=true; it.msg='Doublon possible avec '+dn.id+' ('+dn.nom+') : à vérifier'; }
    else it.msg='Nouvelle personne';
  });
  return items;
}
function lotValForm(rows,mp){
  const g=(r,k)=>mp[k]>=0?r[mp[k]]:'';
  const seen=new Set(), first={}, items=[];
  rows.forEach((r,i)=>{
    const t=k=>sv(g(r,k));
    const it={n:i+1,ref:t('ref'),code:t('code').toUpperCase(),pid:t('pid'),rec:null,key:'',status:'error',msg:'',warn:false,cols:[]};
    items.push(it);
    it.cols=[it.ref,it.code,it.pid];
    if(!it.ref||!t('date')||!it.code||!it.pid){ it.msg='Réf. session, date, module ou ID Personnel manquant'; return; }
    const date=parseDateAny(g(r,'date'));
    if(!date){ it.msg='Date invalide (jj/mm/aaaa ou aaaa-mm-jj)'; return; }
    const mod=S.modules.find(x=>x.code===it.code);
    if(!mod){ it.msg='Module inconnu dans la matrice : '+it.code; return; }
    it.cols=[it.ref,it.code+' · '+mod.nom,it.pid];
    const per=S.personnel.find(x=>x.id===it.pid);
    if(!per){ it.msg='ID inconnu : importez d\'abord le personnel'; return; }
    const dur=parseNum(g(r,'duree')); if(dur===null){ it.msg='Durée invalide'; return; }
    const end=parseDateAny(g(r,'end')); if(end===null){ it.msg='Échéance invalide'; return; }
    const type=normFType(t('type')); if(type===null){ it.msg='Type inconnu (Interne, Externe ou e-learning)'; return; }
    const pk=it.pid+'|'+it.code+'|'+date;
    if(seen.has(pk)){ it.msg='Participant déjà listé dans ce fichier'; return; }
    seen.add(pk);
    it.rec={pid:it.pid,code:it.code,date,formateur:t('formateur'),entite:t('entite'),duree:dur===''?null:dur,type,cert:t('cert'),end:end||null};
    if(S.habilitations.some(h=>h.pid===it.pid&&h.code===it.code&&h.issue===date)){ it.status='skip'; it.msg='Déjà enregistré pour ce module et cette date'; return; }
    it.key=it.ref+'|'+it.code+'|'+date;
    it.status='new';
    const f=first[it.key];
    if(!f) first[it.key]=it.rec;
    else if(f.formateur!==it.rec.formateur||f.entite!==it.rec.entite||f.duree!==it.rec.duree||f.type!==it.rec.type){
      it.warn=true; it.msg='Formateur, entité, durée ou type différents du premier participant de la session : valeurs du premier retenues'; return;
    }
    if(/^inactif/i.test(per.statut)){ it.warn=true; it.msg='Personne inactive : à vérifier'; }
    else it.msg='Nouvelle participation';
  });
  return items;
}

// --- Affichage ---
function lotRender(el){

  const missing=hasFile?T.fields.filter(f=>f.req&&!(LOT.map[f.k]>=0)).map(f=>f.l):[];
  const opt=(list,cur)=>list.map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${esc(l)}</option>`).join('');
  const headOpts=k=>'<option value="-1">— ignorer —</option>'+LOT.headers.map((h,i)=>`<option value="${i}"${LOT.map[k]===i?' selected':''}>${esc(h||'(colonne '+(i+1)+')')}</option>`).join('');
  el.innerHTML=`
  <div class="card"><h3>1. Choisir le type de données</h3>
    <div class="row"><label class="f">Données à importer<select id="lotTarget">${opt([['pers','Personnel'],['form','Formations (participants)']],LOT.target)}</select></label>
      <div class="fix"><button type="button" class="btn" data-ltpl>Télécharger le modèle (CSV)</button></div></div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">${esc(T.help)}</p>
  </div>
  <div class="card"><h3>2. Charger le fichier</h3>
    <p class="muted" style="margin-top:0">CSV (séparateur ; ou ,) ou Excel. Le fichier est lu dans votre navigateur : rien n'est enregistré avant l'étape 4.</p>
    <input type="file" id="lotFile" accept=".csv,.txt,.xlsx,.xls,.xlsm">
    ${LOT.file?`<div class="muted" style="font-size:12px;margin-top:8px">${esc(LOT.file)}${hasFile?' · '+LOT.rows.length+' ligne(s) de données'+(LOT.sheet?' · feuille « '+esc(LOT.sheet)+' »':''):''}</div>`:''}
    ${LOT.msg?`<div class="note warn" style="margin-top:8px">${esc(LOT.msg)}</div>`:''}
  </div>
  ${hasFile?`<div class="card"><h3>3. Vérifier la correspondance des colonnes</h3>
    ${LOT.target==='pers'?`<label class="f" style="max-width:420px;margin-bottom:12px">Personnes déjà présentes dans la base<select id="lotMode"><option value="add"${LOT.mode==='add'?' selected':''}>Ignorer : ne rien modifier</option><option value="update"${LOT.mode==='update'?' selected':''}>Mettre à jour les champs renseignés</option></select></label>`:''}
    <div class="dgrid">${T.fields.map(f=>`<label class="f">${esc(f.l)}${f.req?' <span style="color:var(--bad)">*</span>':''}<select data-lmap="${f.k}">${headOpts(f.k)}</select></label>`).join('')}</div>
    ${missing.length?`<div class="note warn" style="margin-top:10px">Colonne obligatoire non associée : ${missing.map(x=>esc(x)).join(', ')}.</div>`:''}
  </div>`:''}
  ${hasFile&&LOT.items?lotPreview():''}
  <div class="card"><h3>${hasFile?'5':'4'}. Historique des lots</h3>${lotHist(hist)}</div>`;

  el.onchange=e=>{
    const i=e.target;
    if(i.id==='lotTarget'){ lotReset(i.value); lotValidate(); dBody(); return; }
    if(i.id==='lotMode'){ LOT.mode=i.value; lotValidate(); dBody(); return; }
    if(i.dataset&&i.dataset.lmap!==undefined){ LOT.map[i.dataset.lmap]=+i.value; lotValidate(); dBody(); return; }
    if(i.id==='lotFile'){
      const f=i.files&&i.files[0]; if(!f) return;
      lotReset(LOT.target);
      lotLoad(f).then(()=>{ if($('#dBody')) dBody(); });
    }
  };
  el.onclick=e=>{
    if(e.target.closest('[data-ltpl]')){ lotTemplate(); return; }
    if(e.target.closest('[data-lgo]')){ lotApply(); return; }
    const u=e.target.closest('[data-lundo]');
    if(u){
      const last=(S.batches||[]).slice(-1)[0]; if(!last) return;
      if(armLot!==last.id){
        armLot=last.id; dBody();
        setTimeout(()=>{ if(armLot===last.id){ armLot=null; if($('#dBody')) dBody(); } },4000);
        return;
      }
      lotUndo();
    }
  };
}

  const items=LOT.items, c={new:0,update:0,skip:0,error:0};
  items.forEach(i=>c[i.status]++);
  const ok=c.new+c.update;
  const P={new:['Nouveau','ok'],update:['Mise à jour','info'],skip:['Ignoré','na'],error:['Erreur','bad']};
  const heads=LOT.target==='pers'?['N°','Statut','ID Personnel','Nom','Détail']:['N°','Statut','Réf. session','Module','Participant','Détail'];
  const rowsH=items.slice(0,300).map(i=>`<tr><td class="mono">${i.n}</td><td>${pill(P[i.status][0],P[i.status][1])}</td>${i.cols.map(x=>`<td>${esc(x)}</td>`).join('')}<td style="font-size:12px;${i.warn?'color:var(--warn)':''}">${esc(i.msg)}</td></tr>`).join('');
  return `<div class="card"><h3>4. Aperçu et import</h3>
    <div class="row" style="margin-bottom:10px;align-items:center">${pill(c.new+' nouveau(x)','ok')} ${pill(c.update+' mise(s) à jour','info')} ${pill(c.skip+' ignoré(s)','na')} ${pill(c.error+' erreur(s)','bad')}</div>

    <div class="tw" style="max-height:340px"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rowsH||'<tr><td colspan="'+heads.length+'" class="empty">Aucune ligne de données.</td></tr>'}</tbody></table></div>

    <div class="muted" style="font-size:12px">Les lignes en erreur ne sont pas importées. Le dernier lot importé peut être annulé.</div></div></div>`;

function lotHist(hist){
  if(!hist.length) return '<p class="muted" style="margin:0">Aucun lot importé pour l\'instant.</p>';
  const last=hist[hist.length-1];
  const rows=hist.slice().reverse().slice(0,15).map(b=>{
    const res=b.kind==='pers'?`${b.added.length} ajoutée(s), ${b.updated.length} mise(s) à jour`:`${b.sessions.length} session(s), ${b.certs} participation(s)`;
    const btn=b===last?`<button type="button" class="btn sm danger" data-lundo>${armLot===b.id?'Confirmer l\'annulation':'Annuler ce lot'}</button>`:'<span class="muted" style="font-size:12px">—</span>';
    return `<tr><td class="mono">${esc(b.id)}</td><td class="mono">${esc(b.at)}</td><td>${b.kind==='pers'?'Personnel':'Formations'}</td><td>${esc(b.file)}</td><td>${res}${b.skipped?', '+b.skipped+' ignoré(s)':''}</td><td>${btn}</td></tr>`;
  }).join('');
  return `<div class="tw" style="max-height:none"><table><thead><tr><th>Lot</th><th>Date</th><th>Données</th><th>Fichier</th><th>Résultat</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function utf8Bytes(s){ if(window.TextEncoder) return new TextEncoder().encode(s); return Uint8Array.from(unescape(encodeURIComponent(s)),c=>c.charCodeAt(0)); }
function lotTemplate(){
  const T=LOT_T[LOT.target];
  const csv='\uFEFF'+T.fields.map(f=>f.h).join(';')+'\r\n';
  const name=LOT.target==='pers'?'modele-import-personnel.csv':'modele-import-formations.csv';
  saveFile(utf8Bytes(csv),name,'text/csv;charset=utf-8').catch(()=>toast('Téléchargement impossible.'));
}

// --- Application du lot (une seule fois, après vérification) ---
function lotApply(){
  const items=(LOT.items||[]).filter(i=>i.status==='new'||i.status==='update');
  if(!items.length){ toast('Aucune ligne valide à importer.'); return; }
  const n=(S.batches||[]).reduce((mx,b)=>Math.max(mx,+String(b.id).slice(4)||0),0)+1;
  const b={id:'LOT-'+String(n).padStart(3,'0'),
    at:new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    kind:LOT.target, file:LOT.file, mode:LOT.mode, added:[], updated:[], sessions:[], certs:0,
    skipped:(LOT.items||[]).filter(i=>i.status==='skip').length};
  if(LOT.target==='pers'){
    items.forEach(it=>{
      const r=it.rec;
      if(it.status==='new'){
        S.personnel.push({id:r.id,nom:r.nom,sexe:r.sexe||'',type:r.type,entreprise:r.entreprise||'',poste:r.poste||'',manager:r.manager||'',
          dateEntree:r.dateEntree||null,statut:r.statut,acces:r.acces||'',derniereVerif:r.derniereVerif||null,groupes:r.secou?['Secouriste désigné']:[]});
        b.added.push(r.id); return;
      }
      const p=S.personnel.find(x=>x.id===r.id); if(!p) return;
      const before={};
      Object.keys(r).forEach(k=>{ if(k==='id'||k==='secou') return; before[k]=p[k]; p[k]=r[k]; });
      if(r.secou!==undefined){
        before.groupes=(p.groupes||[]).slice();
        const has=(p.groupes||[]).includes('Secouriste désigné');
        p.groupes=r.secou?Array.from(new Set((p.groupes||[]).concat(['Secouriste désigné']))):(p.groupes||[]).filter(x=>x!=='Secouriste désigné');
        if(has===r.secou) delete before.groupes;
      }
      b.updated.push({id:p.id,before});
    });
  } else {
    const groups=new Map();
    items.forEach(it=>{ if(!groups.has(it.key)) groups.set(it.key,{first:it.rec,list:[]}); groups.get(it.key).list.push(it.rec); });
    groups.forEach(gr=>{
      const f=gr.first;
      const ents=[...new Set(gr.list.map(x=>{ const p=S.personnel.find(q=>q.id===x.pid); return p?p.entreprise:''; }).filter(Boolean))];
      const res=E.addSession(S,{date:f.date,codes:[f.code],duree:f.duree||undefined,formateur:f.formateur,type:f.type,entite:f.entite,publicCible:ents.join(', '),
        participants:gr.list.map(x=>({pid:x.pid,cert:x.cert||undefined,end:x.end||undefined})),today:TODAY});
      b.sessions.push(res.id); b.certs+=res.added;
    });
  }
  S.batches=(S.batches||[]).concat([b]);
  const msg=LOT.target==='pers'
    ? b.id+' importé : '+b.added.length+' personne(s) ajoutée(s), '+b.updated.length+' mise(s) à jour.'
    : b.id+' importé : '+b.sessions.length+' session(s) créée(s), '+b.certs+' participation(s) enregistrée(s).';
  lotReset(LOT.target); LOT.items=null; F=null; armLot=null;
  commit(msg);
}
// --- Annulation du dernier lot seulement (le plus simple et le plus sûr) ---
function lotUndo(){
  const hist=S.batches||[], b=hist[hist.length-1]; if(!b) return;
  if(b.kind==='pers'){
    const blocked=b.added.filter(id=>S.habilitations.some(h=>h.pid===id));
    if(blocked.length){ armLot=null; toast('Annulation impossible : des certificats ont été ajoutés depuis pour '+blocked.join(', ')+'.'); return; }
    S.personnel=S.personnel.filter(p=>!b.added.includes(p.id));
    b.updated.forEach(u=>{ const p=S.personnel.find(x=>x.id===u.id); if(!p) return; Object.keys(u.before).forEach(k=>{ p[k]=u.before[k]; }); });
  } else {
    S.registre=S.registre.filter(r=>!b.sessions.includes(r.id));
    S.habilitations=S.habilitations.filter(h=>!b.sessions.includes(h.session));
  }
  S.batches=hist.slice(0,-1); armLot=null; F=null;
  commit('Lot '+b.id+' annulé.');
}
